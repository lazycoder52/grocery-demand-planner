[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "demand-planner"
version = "0.1.0"
description = "Grocery demand planning on Corporación Favorita store sales"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Aditya" }]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=15",
    "pyyaml>=6.0",
    "duckdb>=1.0",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "lightgbm>=4.3",
    "optuna>=3.6",
]

[project.optional-dependencies]
app = ["streamlit>=1.35", "plotly>=5.20"]
dev = ["ruff>=0.6", "pytest>=8.0", "pre-commit>=3.7", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "app"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]

[tool.ruff.lint.isort]
known-first-party = ["demand_planner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-ra"
markers = [
    "data: requires the raw Kaggle files in data/raw (skipped when absent)",
]
